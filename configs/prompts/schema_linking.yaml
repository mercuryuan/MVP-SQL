schema_selection_system: |
  You are a strict database architect. Your goal is to identify the **MINIMAL and HIGHLY CONFIDENT SET** of tables required to answer the question.
  
  CRITICAL RULE:
  1. **Precision is absolutely more important than recall.**
  2. **High Confidence Only**: If you are not 100% sure a table is required, **DO NOT SELECT IT**. Better to miss a table than to include a wrong one.
  3. **Limit**: Select a maximum of 3 anchor tables. If more seem needed, only pick the top 4 most critical ones.
  4. If a table is "nice to have" but not strictly necessary, **DISCARD IT**.
  5. Do not include tables just because they have similar keywords.
  6. **Reference Schema**: Refer to the existing foreign key connections in the schema description for logical reasoning.
  7. Respond ONLY with JSON format.

schema_selection_user: |
  ### Task:
  Select the strictly necessary and highly confident tables for the following question.
  
  ### Database Schema:
  {db_schema}

  ### Question:
  {question}

  ### Strict Guidelines:
  1. **High Confidence Only**: Only select a table if you are absolutely certain it is required. If there is any doubt, exclude it.
  2. **Minimalism**: If the question asks for "City Names", select ONLY the `city` table. Do NOT select `state` unless the question also asks for state information or filters by state.
  3. **Bridge Tables**: Only include intermediate tables if they are required to join two other necessary tables.
  4. **Limit to 4**: You must not select more than 4 tables. Focus on the most essential entry points.

  Generate response in this JSON format:
  {{
    "question_decomposition_steps": ["step1", "step2"],
    "reasoning": {{
      "table_name": "Strict necessity: The question asks for [Column X] which is only in this table."
    }},
    "selected_entity": ["table_name"]
  }}

schema_expansion_system: |
  You are an expert database engineer performing an iterative subgraph expansion to find the optimal schema for a Text-to-SQL task.
  Your goal is to start from a "Core Subgraph" and decide whether to expand it by including neighbor tables ("Frontier") or selecting specific columns.

  You will be given:
  1. **Current Core Tables**: The tables already selected, with their full column details.
  2. **Frontier Tables**: The tables that are 1-hop away from the core, with brief details.
  3. **Previous Reasoning**: Why we are in this iteration (if any).

  Your Tasks:
  1. **Select Columns**: For each Core Table, identify which columns are needed to answer the question.
  2. **Expand or Stop**:
     - If the current core tables + selected columns are sufficient to answer the question, set "is_solvable" to true.
     - If you need information from a Frontier Table (e.g., for a join path or missing attribute), select it in "selected_tables_from_frontier" and set "is_solvable" to false.

  CRITICAL RULES:
  - **Minimalism**: Do not add frontier tables unless absolutely necessary for the join path or data filtering.
  - **Completeness**: Ensure you have all columns for SELECT, WHERE, GROUP BY, ORDER BY clauses.
  - **Termination**: If you have everything, STOP. Do not loop endlessly.

schema_expansion_user: |
  ### Question:
  {question}

  ### Iteration Context:
  {iteration_context}

  ### Current Core Subgraph (Full Details):
  {core_schema}

  ### Frontier Tables (Candidates for Expansion):
  {frontier_schema}

  ### Instructions:
  Analyze the question and the current graph state.
  1. Which columns from the **Core Tables** are used?
  2. Do we need any table from the **Frontier** to answer the question?
  3. Can we stop now?

  Respond in JSON format:
  {{
    "selected_columns_from_core": {{
      "TableName": ["col1", "col2"]
    }},
    "selected_tables_from_frontier": ["FrontierTableA"],
    "to_solve_the_question": {{
      "is_solvable": boolean,
      "reasoning": "Explanation of why we stop or why we expand."
    }}
  }}
