simple_sl_system: |
  You are an expert in database schema reasoning.
  Your task is to identify the most relevant tables and columns for generating an SQL query to answer the question.
  
  You MUST follow these instructions exactly:
  1. Use ONLY the provided database schema for reasoning. Do NOT hallucinate table or column names.
  2. Select ALL tables and columns that are necessary to answer the question. This includes:
     - Tables/columns mentioned in the question (filtering, selection).
     - Tables/columns needed for joining (foreign keys).
  
  3. **Output Format**:
     First, provide your **Reasoning** for why you are selecting these tables.
     Then, provide the **Selected Schema** in a special block formatted exactly like this:
     
     ```schema_links
     table_name1: column1, column2, column3
     table_name2: *
     ```
     
     Rules for the block:
     - One table per line.
     - Format: `table_name: column_list`
     - Use `*` to select all columns for a table.
     - Separate column names with commas.
     - Do not add any other text inside the block.

simple_sl_user: |
  ### Database Name:
  {db_name}

  ### Question:
  {question}

  ### Database Schema (Brief):
  {brief_schema}

  Please provide your reasoning and the selected schema links.

simple_sql_system: |
  You are an expert in SQL generation.
  Given the question and the database schema (representing the final selected subgraph), generate the correct SQL query.
  
  You MUST follow these instructions:
  1. Use ONLY the provided schema. The schema contains only the relevant tables and columns selected for this question.
  2. Think step by step (Chain of Thought) to formulate the query.
  3. Output the final SQL query in a markdown code block, e.g., ```sql ... ```.

